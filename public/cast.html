<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090807">
  <title>HOST | The Artemis</title>
  <meta name="description" content="The Artemis Cast Profile">
  <link rel="icon" type="image/png" href="/assets/the-artemis-symbol.png">
  <link rel="apple-touch-icon" href="/assets/the-artemis-symbol.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=8">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#080706;color:#f5eee2;font-family:"Noto Serif JP",serif;min-height:100vh}
    .profile-header{height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid rgba(205,167,95,.18);background:rgba(8,7,6,.96);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}
    .profile-header .brand{position:relative}
    .profile-back-top{border:1px solid rgba(205,167,95,.45);padding:10px 15px;color:#e5c986;font:600 12px "Cormorant Garamond",serif;letter-spacing:.14em}
    .profile-main{min-height:calc(100vh - 160px);padding:70px 22px;background:radial-gradient(circle at 70% 25%,rgba(205,167,95,.10),transparent 32%),linear-gradient(135deg,#0d0a07,#070605)}
    .profile-shell{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:minmax(320px,460px) 1fr;border:1px solid rgba(205,167,95,.36);background:linear-gradient(145deg,#14110d,#0a0806);box-shadow:0 35px 110px rgba(0,0,0,.55);overflow:hidden}
    .profile-visual{position:relative;min-height:650px;border-right:1px solid rgba(205,167,95,.25);background:radial-gradient(circle at 50% 25%,#33291d,#16110d 58%,#090706)}
    .profile-image-wrap{position:absolute;inset:0;overflow:hidden}
    .profile-image-wrap img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
    .profile-placeholder{width:100%;height:100%;display:grid;place-items:center;font-size:0;color:transparent;background:radial-gradient(circle at 50% 42%,rgba(205,167,95,.12),transparent 42%),url('/assets/the-artemis-symbol.png') center/42% auto no-repeat}
    .profile-number{position:absolute;left:22px;top:22px;z-index:2;border:1px solid rgba(240,210,150,.55);padding:6px 12px;background:rgba(0,0,0,.42);font:600 12px "Cormorant Garamond",serif;letter-spacing:.22em;color:#f0d296}
    .profile-info{padding:76px 64px;display:flex;flex-direction:column;justify-content:center;min-width:0}
    .profile-info .eyebrow{margin:0 0 20px}
    .profile-roman{margin:0;color:#ae9c80;font:500 20px "Cormorant Garamond",serif;letter-spacing:.12em}
    .profile-info h1{font:500 clamp(46px,6vw,82px)/1.05 "Noto Serif JP",serif;margin:8px 0 0;color:#f6ebd9;overflow-wrap:anywhere}
    .profile-rule{width:76px;height:1px;background:#cda75f;margin:30px 0}
    .profile-today{display:flex;align-items:center;gap:18px;border-top:1px solid rgba(205,167,95,.2);border-bottom:1px solid rgba(205,167,95,.2);padding:15px 0;margin-bottom:30px}
    .profile-today span{font:600 11px "Cormorant Garamond",serif;letter-spacing:.18em;color:#9e8e74}
    .profile-today strong{font:500 20px "Cormorant Garamond",serif;color:#e7c77e}
    .profile-label{font:600 11px "Cormorant Garamond",serif;letter-spacing:.2em;color:#cda75f;margin:0 0 12px}
    .profile-bio>p:last-child{white-space:pre-line;color:#c8bbaa;line-height:2;margin:0;font-size:15px}
    .profile-back{display:inline-flex;align-items:center;justify-content:space-between;gap:50px;width:max-content;min-width:220px;margin-top:42px;border:1px solid rgba(205,167,95,.55);padding:12px 16px;color:#e7cc8d;font-size:13px}
    .profile-error{width:min(760px,100%);margin:100px auto;text-align:center;border:1px solid rgba(205,167,95,.3);padding:70px 30px}
    .profile-error h1{font:500 46px "Cormorant Garamond",serif;color:#e4c681}
    .profile-error a{display:inline-block;margin-top:22px;border-bottom:1px solid #cda75f;color:#e4c681}
    .profile-footer{padding:32px 22px;text-align:center;border-top:1px solid rgba(205,167,95,.14);color:#776e61;font-size:11px}
    @media(max-width:800px){.profile-header{height:72px;padding:0 14px}.profile-back-top{font-size:10px}.profile-main{padding:30px 14px}.profile-shell{grid-template-columns:1fr}.profile-visual{min-height:520px;border-right:0;border-bottom:1px solid rgba(205,167,95,.25)}.profile-info{padding:42px 28px}.profile-info h1{font-size:46px}.profile-placeholder{background-size:34% auto}}
    @media(max-width:480px){.profile-visual{min-height:440px}.profile-info{padding:34px 22px}.profile-back{width:100%}.profile-header .brand{width:104px!important;min-width:104px!important}.profile-back-top{padding:8px 10px}}
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="profile-header">
    <a class="brand" href="/"><span class="brand-mark">A</span><span><strong id="profileBrand">The Artemis</strong><small>LUXURY HOST CLUB</small></span></a>
    <a class="profile-back-top" href="/#cast">HOST LIST <span>→</span></a>
  </header>

  <main class="profile-main" id="profileMain">
    <section class="profile-shell" id="profileContent" hidden>
      <div class="profile-visual">
        <div class="profile-image-wrap" id="profileImageWrap"></div>
        <div class="profile-number" id="profileTodayBadge" hidden>TODAY</div>
      </div>
      <div class="profile-info">
        <p class="eyebrow">THE ARTEMIS HOST</p>
        <p class="profile-roman" id="profileRoman"></p>
        <h1 id="profileName"></h1>
        <div class="profile-rule"></div>
        <div class="profile-today" id="profileToday" hidden>
          <span>TODAY'S SHIFT</span>
          <strong id="profileShift"></strong>
        </div>
        <div class="profile-bio">
          <p class="profile-label">PROFILE</p>
          <p id="profileBio"></p>
        </div>
        <a class="profile-back" href="/#cast">在籍ホスト一覧へ <span>→</span></a>
      </div>
    </section>

    <section class="profile-error" id="profileError" hidden>
      <p class="eyebrow">THE ARTEMIS</p>
      <h1>HOST NOT FOUND</h1>
      <p>ホスト情報が見つかりませんでした。</p>
      <a href="/#cast">在籍ホスト一覧へ戻る</a>
    </section>
  </main>

  <footer class="profile-footer">© <span id="year"></span> The Artemis. All Rights Reserved.</footer>
  <script src="/js/cast-profile.js?v=3"></script>
</body>
</html>
